name: Extended builds

# The builds of ci.yml with C++20 (Natron Qt6 builds and RB-2.7). Weekly, only
# if master changed in the last week, and on demand.

on:
  workflow_dispatch:
    inputs:
      cxxstd:
        description: C++ standard to build with
        type: choice
        options: [c++20, c++17]
        default: c++20
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # skip the scheduled run if master didn't change since the previous one
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
      - id: check
        shell: bash -eo pipefail {0}
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log --since='8 days ago' --format=%h -1)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No commits in the last 8 days: skipping."
          fi

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/platforms.yml
    with:
      cxxstd: ${{ (github.event_name == 'workflow_dispatch' && inputs.cxxstd) || 'c++20' }}
      artifacts: false
