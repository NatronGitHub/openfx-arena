name: Platform builds

# Reusable workflow: the three builds (Linux, Windows UCRT64, macOS 15 arm64 with
# Xcode clang and MacPorts), called by ci.yml (per push/PR, C++17) and
# extended.yml (weekly/on demand, C++20, plus a weekly macOS C++17 build and a
# weekly Linux build with the Makefiles). They build with CMake (BUILD_TESTING: ctest
# loads the bundle), or with the Makefiles (build-system: make), which are the
# manual fallback of Natron's build-plugins.sh (PLUGINS_BUILD_SYSTEM=make; its
# default is CMake).

on:
  workflow_call:
    inputs:
      cxxstd:
        type: string
        default: c++17
      artifacts:
        type: boolean
        default: false
      macos-only:
        description: Build only on macOS (weekly C++17 macOS build)
        type: boolean
        default: false
      linux-only:
        description: Build only on Linux (weekly Make build)
        type: boolean
        default: false
      build-system:
        description: cmake, or make (the Makefiles)
        type: string
        default: cmake

permissions:
  contents: read

env:
  CXXSTD: ${{ inputs.cxxstd }}
  UPLOAD_ARTIFACTS: ${{ inputs.artifacts }}
  # the CMake install: Arena.ofx.bundle in install/OFX/Plugins
  CMAKE_BUNDLE: install/OFX/Plugins/Arena.ofx.bundle

jobs:
  linux:
    if: ${{ !inputs.macos-only }}
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install packages
        run: |
          sudo apt-get update
          # the -dev packages of ImageMagick's own dependencies are needed too, since
          # Makefile.master and CMakeLists.txt link with pkg-config --static (libssl-dev and
          # libzstd-dev: for libzip and curl). python3-numpy and imagemagick (convert): for ctest's
          # readpsd_layers (tests/readpsd). libexpat1-dev: for openfx's HostSupport (hostDemo, ctest's
          # render_Arena), which no longer bundles expat
          sudo apt-get install -y cmake libssl-dev libzstd-dev python3-numpy imagemagick libopencolorio-dev libgl-dev libglu1-mesa-dev libexpat1-dev libmagick++-dev zlib1g-dev libwebp-dev \
            liblcms2-dev libfontconfig1-dev libpango1.0-dev libxml2-dev libzip-dev librsvg2-dev libglib2.0-dev libfftw3-dev \
            libpoppler-dev libpoppler-glib-dev libpoppler-private-dev librevenge-dev libcdr-dev libsox-dev libcairo-dev \
            libcurl4-openssl-dev libbz2-dev libdjvulibre-dev libexif-dev libfreetype6-dev libjpeg-dev liblqr-1-0-dev \
            libltdl-dev libopenexr-dev libopenjp2-7-dev libpng-dev libtiff-dev libwmf-dev libx11-dev libxext-dev libxt-dev
      - name: Build (release, CMake)
        if: inputs.build-system == 'cmake'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD="${CXXSTD#c++}" -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build --parallel 4
          cmake --install build
      - name: Check the installed bundle (linuxCheckBundle.sh)
        if: inputs.build-system == 'cmake'
        run: |
          # openfx's linuxCheckBundle.sh, whose path CMake caches as OFX_LINUX_CHECK_BUNDLE.
          # --no-needed: the bundle links the distribution's libraries instead of bundling them.
          # The symbol-version limits are disabled (99): Ubuntu 24.04 is newer than the release
          # baseline, EL9. A Rocky Linux 9 job would keep the defaults (EL9's limits).
          check=$(sed -n 's/^OFX_LINUX_CHECK_BUNDLE:FILEPATH=//p' build/CMakeCache.txt)
          test -x "$check"
          OFX_ABI_GLIBC=99 OFX_ABI_GLIBCXX=99 OFX_ABI_CXXABI=99 OFX_ABI_GCC=99 OFX_ABI_GOMP=99 \
            OFX_ABI_LIBATOMIC=99 OFX_ABI_ZLIB=99 \
            "$check" --no-needed install/OFX/Plugins
      - name: Build (debug, CMake)
        if: inputs.build-system == 'cmake'
        run: |
          cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug -DOFX_CXX_STANDARD="${CXXSTD#c++}"
          cmake --build build-debug --parallel 4
      - name: Load and render tests (ctest, hostDemo)
        # -V: print every test's output (the per-plug-in load and render results), not only on failure
        if: inputs.build-system == 'cmake'
        run: ctest --test-dir build -V --output-on-failure
      - name: Build (release, Make)
        if: inputs.build-system == 'make'
        run: make -j4 CONFIG=release CXX="g++ -std=$CXXSTD"
      - name: Build (debug, Make)
        if: inputs.build-system == 'make'
        run: make -j4 CONFIG=debug CXX="g++ -std=$CXXSTD"
      - name: Verify that the plugins load
        env:
          BUNDLE: ${{ inputs.build-system == 'make' && 'Bundle/Linux-64-release/Arena.ofx.bundle' || env.CMAKE_BUNDLE }}
        run: |
          # RTLD_NOW instead of RTLD_LAZY, so that missing symbols make loading fail
          sed -e 's/RTLD_LAZY/RTLD_NOW/g' OpenFX/HostSupport/src/ofxhBinary.cpp > ofxhBinaryStrict.cpp
          g++ -o verify_plugin_loads OpenFX-IO/tests/verify_plugin_loads.cpp ofxhBinaryStrict.cpp \
            -I OpenFX/HostSupport/include/ -I OpenFX/include/
          ./verify_plugin_loads "$BUNDLE/Contents/Linux-x86-64/Arena.ofx" | tee load.txt
          grep -q "^Num_plugins: 44$" load.txt
      - name: Upload artifacts
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-arena-linux-release-${{ inputs.cxxstd }}-${{ inputs.build-system }}
          path: ${{ inputs.build-system == 'make' && 'Bundle/Linux-64-release/Arena.ofx.bundle' || env.CMAKE_BUNDLE }}

  windows:
    if: ${{ !inputs.macos-only && !inputs.linux-only }}
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install MSYS2 packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          cache: true
          pacboy: >-
            cc:p pkgconf:p ntldd:p imagemagick:p opencolorio:p lcms2:p fontconfig:p pango:p librsvg:p
            libxml2:p libzip:p libcdr:p librevenge:p sox:p curl:p poppler:p cmake:p ninja:p python-numpy:p expat:p
          install: make
      - name: Build (release, CMake)
        if: inputs.build-system == 'cmake'
        run: |
          set -eo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD="${CXXSTD#c++}" -DIM=7 \
            -DBUILD_TESTING=ON -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build --parallel 4
          cmake --install build
      - name: Build (debug, CMake)
        if: inputs.build-system == 'cmake'
        run: |
          set -eo pipefail
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOFX_CXX_STANDARD="${CXXSTD#c++}" -DIM=7
          cmake --build build-debug --parallel 4
      - name: Load and render tests (ctest, hostDemo)
        # -V: print every test's output (the per-plug-in load and render results), not only on failure
        if: inputs.build-system == 'cmake'
        run: |
          set -eo pipefail
          ctest --test-dir build -V --output-on-failure
      - name: Build (release, Make)
        if: inputs.build-system == 'make'
        run: |
          set -eo pipefail
          make -j4 CONFIG=release MINGW=1 IM=7 CXX="g++ -std=$CXXSTD"
      - name: Build (debug, Make)
        if: inputs.build-system == 'make'
        run: |
          set -eo pipefail
          make -j4 CONFIG=debug MINGW=1 IM=7 CXX="g++ -std=$CXXSTD"
      - name: Find the bundle
        run: |
          set -eo pipefail
          if [ "${{ inputs.build-system }}" = make ]; then
            echo "BUNDLE=$(find Bundle -maxdepth 1 -name "*-release")/Arena.ofx.bundle" >> "$GITHUB_ENV"
          else
            echo "BUNDLE=$CMAKE_BUNDLE" >> "$GITHUB_ENV"
          fi
      - name: Verify that the plugins load
        run: |
          set -eo pipefail
          g++ -o verify_plugin_loads OpenFX-IO/tests/verify_plugin_loads.cpp OpenFX/HostSupport/src/ofxhBinary.cpp \
            OpenFX/HostSupport/src/ofxhUtilities.cpp -I OpenFX/HostSupport/include/ -I OpenFX/include/
          ./verify_plugin_loads "$BUNDLE/Contents/Win64/Arena.ofx" | tee load.txt
          grep -q "^Num_plugins: 44.\?$" load.txt
      - name: Diagnose plugin load failure
        if: failure()
        run: |
          OFX="$BUNDLE/Contents/Win64/Arena.ofx"
          # missing DLLs (ext-ms-win-* API sets are always reported, ignore them)
          ntldd -R "$OFX" | grep -iE "not found|=> *$" | grep -v "ext-ms-" || true
          # the Windows error message (e.g. a missing entry point in a DLL)
          cat > loadlib.c <<'EOC'
          #include <windows.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
              HMODULE h = LoadLibraryA(argv[1]);
              if (h) { puts("loaded"); return 0; }
              char msg[512];
              DWORD err = GetLastError();
              FormatMessageA(FORMAT_MESSAGE_FROM_SYSTEM, NULL, err, 0, msg, sizeof msg, NULL);
              printf("LoadLibrary error %lu: %s\n", err, msg);
              return 1;
          }
          EOC
          gcc -o loadlib loadlib.c
          ./loadlib "$OFX" || true
          for d in $(ntldd -R "$OFX" | grep -i ucrt64 | awk '{print $3}' | sort -u); do
            ./loadlib "$(cygpath -w "$d")" > /dev/null || echo "FAILS: $d: $(./loadlib "$(cygpath -w "$d")")"
          done
      - name: Upload artifacts
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-arena-windows-release-${{ inputs.cxxstd }}-${{ inputs.build-system }}
          path: ${{ env.BUNDLE }}

  macos:
    # macOS arm64 runners are scarce: start only once Linux and Windows have passed. Merging
    # only requires Linux and Windows; macOS is also built weekly (extended.yml).
    needs: [linux, windows]
    if: ${{ !cancelled() && !inputs.linux-only && (inputs.macos-only || (needs.linux.result == 'success' && needs.windows.result == 'success')) }}
    # System (Xcode) clang with MacPorts libraries, as for Natron's macOS SDK.
    name: macOS 15 arm64 (Xcode clang, MacPorts)
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      # libomp: Apple clang has no OpenMP runtime; Natron builds with -Xpreprocessor -fopenmp
      # py313-numpy, and python3 selected: for ctest's readpsd_layers (tests/readpsd)
      # expat: for openfx's HostSupport (hostDemo, ctest's render_Arena), which no longer bundles it
      PORTS: cmake pkgconfig gsed libomp py313-numpy ImageMagick opencolorio lcms2 fontconfig pango librsvg poppler libxml2 libzip librevenge libcdr-0.1 sox curl expat
      # every macOS plug-in bundle targets macOS 14.0: CMake takes CMAKE_OSX_DEPLOYMENT_TARGET from it,
      # and openfx's Makefile.master passes it to -mmacosx-version-min (openfx#149). Both default to
      # 14.0 already (CMakeLists.txt, openfx#160): kept to make the target explicit. The MacPorts
      # libraries are built for the runner's macOS, so deploying them warns (OFX_DEPLOY_STRICT_MINOS off)
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install MacPorts
        uses: melusina-org/setup-macports@v1
      - name: Install MacPorts packages
        run: |
          sudo port -N install $PORTS
          sudo port select --set python3 python313
          # same fix as in Natron's INSTALL_MACOS.md
          sudo sed -i '' -e 's/Zstd::Zstd/zstd/' /opt/local/lib/pkgconfig/libzip.pc
      - name: Build (release, CMake)
        if: inputs.build-system == 'cmake'
        run: |
          # MacPorts' cmake and pkg-config, the system (Xcode) clang
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          c++ --version
          cmake --version
          # OFX_DEPLOY_BUNDLES: osxDeploy.sh, as the Makefiles' release build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD="${CXXSTD#c++}" -DBUILD_TESTING=ON \
            -DOFX_DEPLOY_BUNDLES=ON -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build --parallel 4
          cmake --install build
      - name: Build (debug, CMake)
        if: inputs.build-system == 'cmake'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug -DOFX_CXX_STANDARD="${CXXSTD#c++}"
          cmake --build build-debug --parallel 4
      - name: Load and render tests (ctest, hostDemo)
        # -V: print every test's output (the per-plug-in load and render results), not only on failure
        if: inputs.build-system == 'cmake'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          ctest --test-dir build -V --output-on-failure
      - name: Build (release, Make)
        if: inputs.build-system == 'make'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          c++ --version
          make -j4 CONFIG=release CXX="c++ -std=$CXXSTD" CXXFLAGS_EXTRA="-DGL_SILENCE_DEPRECATION"
      - name: Build (debug, Make)
        if: inputs.build-system == 'make'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          make -j4 CONFIG=debug CXX="c++ -std=$CXXSTD" CXXFLAGS_EXTRA="-DGL_SILENCE_DEPRECATION"
      - name: Verify that the plugins load
        env:
          BUNDLE: ${{ inputs.build-system == 'make' && 'Bundle/Darwin-64-release/Arena.ofx.bundle' || env.CMAKE_BUNDLE }}
        run: |
          sed -e 's/RTLD_LAZY/RTLD_NOW/g' OpenFX/HostSupport/src/ofxhBinary.cpp > ofxhBinaryStrict.cpp
          c++ -std=c++11 -o verify_plugin_loads OpenFX-IO/tests/verify_plugin_loads.cpp ofxhBinaryStrict.cpp \
            -I OpenFX/HostSupport/include/ -I OpenFX/include/
          # the installed (deployed) bundle, with its own copies of the MacPorts libraries
          ./verify_plugin_loads "$BUNDLE/Contents/MacOS/Arena.ofx" | tee load.txt
          grep -q "^Num_plugins: 44$" load.txt
      - name: Upload artifacts
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openfx-arena-macos-release-${{ inputs.cxxstd }}-${{ inputs.build-system }}
          path: ${{ inputs.build-system == 'make' && 'Bundle/Darwin-64-release/Arena.ofx.bundle' || env.CMAKE_BUNDLE }}
