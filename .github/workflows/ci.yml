name: Continuous Integration tests

# Frugal CI (NatronGitHub runners are shared by all repos): one run per change.
# Pushes run CI only on master, RB-* and tags; feature branches run through their
# pull request (not on every push, and not twice). Draft pull requests don't run
# CI: mark the PR ready for review to run it. Superseded runs are cancelled,
# except for tags. The C++20 builds run weekly in extended.yml. macOS starts only
# once Linux and Windows pass, and is not required for merging (scarce runners).
# Use [skip ci] for comment- or doc-only commits.

on:
  workflow_dispatch:
    inputs:
      artifacts:
        description: Upload the release bundles as artifacts
        type: boolean
        default: false
  push:
    branches: [master, 'RB-*']
    tags: ['*']
    paths-ignore: ['**/*.md', 'LICENSE', 'COPYING', 'gpl-header-c.txt']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md', 'LICENSE', 'COPYING', 'gpl-header-c.txt']

permissions:
  contents: read

concurrency:
  # event_name keeps a manual dispatch from cancelling (or being cancelled by) a push
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # no CI for draft pull requests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/platforms.yml
    with:
      # C++ standard policy: C++17 per push/PR (Natron RB-2.6 Qt5), C++20 in extended.yml
      cxxstd: c++17
      # artifacts only on demand or for tags
      artifacts: ${{ (github.event_name == 'workflow_dispatch' && inputs.artifacts) || startsWith(github.ref, 'refs/tags/') }}
