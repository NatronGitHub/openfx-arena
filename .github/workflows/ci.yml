name: Continuous Integration tests

on:
  workflow_dispatch: {}
  push:
    paths-ignore:
      - COPYING
      - LICENSE
      - README.md
  pull_request:
    paths-ignore:
      - COPYING
      - LICENSE
      - README.md

# Read-only token: the jobs run third-party actions and install packages from
# external repositories, none of which need to write to this repository.
permissions:
  contents: read

jobs:
  ubuntu_build:
    name: Build Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Ubuntu system packages
        run: |
          sudo apt update
          sudo apt-get install libopencolorio-dev libgl-dev libglu1-mesa-dev libmagick++-dev zlib1g-dev libwebp-dev \
            liblcms2-dev libfontconfig1-dev libpango1.0-dev libxml2-dev libzip-dev librsvg2-dev libglib2.0-dev libfftw3-dev \
            libpoppler-dev libpoppler-glib-dev libpoppler-private-dev librevenge-dev libcdr-dev libsox-dev libcairo-dev \
            libcurl4-openssl-dev libbz2-dev libdjvulibre-dev libexif-dev libfreetype6-dev libjpeg-dev liblqr-1-0-dev \
            libltdl-dev libopenexr-dev libopenjp2-7-dev libpng-dev libtiff-dev libwmf-dev libx11-dev libxext-dev libxt-dev
      - name: Build (release)
        run: |
          make -j4 CONFIG=release
          mkdir -p Bundle/ArenaPlugin
          cp -a Bundle/Linux-64-release/Arena.ofx.bundle Bundle/ArenaPlugin
      - name: Build (debug)
        run: make -j4 CONFIG=debug
      - name: Verify that the plugins load
        run: |
          # RTLD_NOW instead of RTLD_LAZY, so that missing symbols make loading fail
          sed -e 's/RTLD_LAZY/RTLD_NOW/g' OpenFX/HostSupport/src/ofxhBinary.cpp > ofxhBinaryStrict.cpp
          g++ -o verify_plugin_loads OpenFX-IO/.github/workflows/verify_plugin_loads.cpp ofxhBinaryStrict.cpp \
            -I OpenFX/HostSupport/include/ -I OpenFX/include/
          ./verify_plugin_loads Bundle/ArenaPlugin/Arena.ofx.bundle/Contents/Linux-x86-64/Arena.ofx
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openfx-arena-build-ubuntu_24-release
          path: Bundle/ArenaPlugin

  windows_build:
    name: Build Windows (MSYS2 MinGW64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install MSYS2 packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            git base-devel unzip mingw-w64-x86_64-wget mingw-w64-x86_64-cc mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-lcms2 mingw-w64-x86_64-fontconfig mingw-w64-x86_64-pango
            mingw-w64-x86_64-librsvg mingw-w64-x86_64-libxml2 mingw-w64-x86_64-libzip mingw-w64-x86_64-libcdr
            mingw-w64-x86_64-librevenge mingw-w64-x86_64-curl mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-poppler
      # poppler comes from MSYS2: natron_poppler (22.01) was built against older
      # MSYS2 libraries and libpoppler-glib fails to load (missing entry point)
      - name: Install Natron pacman repository (ImageMagick, OpenColorIO, sox)
        run: |
          mkdir ${GITHUB_WORKSPACE}/natron_pacman_repo
          cd ${GITHUB_WORKSPACE}/natron_pacman_repo
          wget -q https://github.com/NatronGitHub/Natron/releases/download/windows-mingw-package-repo/natron_package_repo.zip
          unzip -q natron_package_repo.zip
          NATRON_REPO_PATH=`cygpath -u $GITHUB_WORKSPACE`
          echo -e "#NATRON_REPO_START\n[natron]\nSigLevel = Optional TrustAll\nServer = file://${NATRON_REPO_PATH}/natron_pacman_repo/\n#NATRON_REPO_END" >> /etc/pacman.conf
          pacman -Sy
          pacman -S --needed --noconfirm --overwrite "*" mingw-w64-x86_64-natron_imagemagick \
            mingw-w64-x86_64-natron_opencolorio-git mingw-w64-x86_64-natron_sox
      - name: Build (release)
        run: |
          make -j4 CONFIG=release MINGW=1
          mkdir -p Bundle/ArenaPlugin
          cp -a `find Bundle -maxdepth 1 -name "MINGW64_NT*-release"`/Arena.ofx.bundle Bundle/ArenaPlugin
      - name: Build (debug)
        run: make -j4 CONFIG=debug MINGW=1
      - name: Verify that the plugins load
        run: |
          # make the MinGW runtime DLLs findable
          export PATH=/mingw64/bin:$PATH
          g++ -o verify_plugin_loads OpenFX-IO/.github/workflows/verify_plugin_loads.cpp OpenFX/HostSupport/src/ofxhBinary.cpp \
            OpenFX/HostSupport/src/ofxhUtilities.cpp -I OpenFX/HostSupport/include/ -I OpenFX/include/
          ./verify_plugin_loads Bundle/ArenaPlugin/Arena.ofx.bundle/Contents/Win64/Arena.ofx
      - name: Diagnose plugin load failure
        if: failure()
        run: |
          export PATH=/mingw64/bin:$PATH
          # missing DLLs (ext-ms-win-* API sets are always reported, ignore them)
          ntldd -R Bundle/ArenaPlugin/Arena.ofx.bundle/Contents/Win64/Arena.ofx | grep -iE "not found|=> *$" | grep -v "ext-ms-" || true
          # the Windows error message (e.g. a missing entry point in a DLL)
          cat > loadlib.c <<'EOF'
          #include <windows.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
              HMODULE h = LoadLibraryA(argv[1]);
              if (h) { puts("loaded"); return 0; }
              char msg[512];
              DWORD err = GetLastError();
              FormatMessageA(FORMAT_MESSAGE_FROM_SYSTEM, NULL, err, 0, msg, sizeof msg, NULL);
              printf("LoadLibrary error %lu: %s\n", err, msg);
              return 1;
          }
          EOF
          gcc -o loadlib loadlib.c && ./loadlib Bundle/ArenaPlugin/Arena.ofx.bundle/Contents/Win64/Arena.ofx || true
          # load each DLL Arena.ofx depends on, to find the one with a missing entry point
          for d in $(ntldd -R Bundle/ArenaPlugin/Arena.ofx.bundle/Contents/Win64/Arena.ofx | grep -i mingw64 | awk '{print $3}' | sort -u); do
            ./loadlib "$(cygpath -w "$d")" > /dev/null || echo "FAILS: $d: $(./loadlib "$(cygpath -w "$d")")"
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openfx-arena-build-windows-release
          path: Bundle/ArenaPlugin

  macos_build:
    # MacPorts, as for Natron's macOS SDK (standard binary ports; the
    # ImageMagick +natron variant would have to be built from source)
    name: Build macOS (MacPorts)
    runs-on: macos-15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install MacPorts
        uses: melusina-org/setup-macports@v1
      - name: Install MacPorts packages
        run: |
          # gsed is needed by OpenFX's osxDeploy.sh (release bundle)
          sudo port -N install pkgconfig gsed ImageMagick opencolorio lcms2 fontconfig pango librsvg poppler \
            libxml2 libzip librevenge libcdr-0.1 sox curl
          # same fix as in Natron's INSTALL_MACOS.md
          sudo sed -i '' -e 's/Zstd::Zstd/zstd/' /opt/local/lib/pkgconfig/libzip.pc
      - name: Build (release)
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          make -j4 CONFIG=release CXXFLAGS_EXTRA="-DGL_SILENCE_DEPRECATION"
          mkdir -p Bundle/ArenaPlugin
          cp -a Bundle/Darwin-64-release/Arena.ofx.bundle Bundle/ArenaPlugin
      - name: Build (debug)
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:$PATH
          make -j4 CONFIG=debug CXXFLAGS_EXTRA="-DGL_SILENCE_DEPRECATION"
      - name: Verify that the plugins load
        run: |
          sed -e 's/RTLD_LAZY/RTLD_NOW/g' OpenFX/HostSupport/src/ofxhBinary.cpp > ofxhBinaryStrict.cpp
          clang++ -std=c++11 -o verify_plugin_loads OpenFX-IO/.github/workflows/verify_plugin_loads.cpp ofxhBinaryStrict.cpp \
            -I OpenFX/HostSupport/include/ -I OpenFX/include/
          ./verify_plugin_loads Bundle/ArenaPlugin/Arena.ofx.bundle/Contents/MacOS/Arena.ofx
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openfx-arena-build-macos-release
          path: Bundle/ArenaPlugin
